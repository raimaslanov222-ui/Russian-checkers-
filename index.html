<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkers Ultimate 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #0d0d0d; --surface: #1a1a1a; --primary: #4caf50;
            --accent: #ff9800; --cell-light: #eeeed2; --cell-dark: #769656;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        /* Кастомные окна меню */
        #start-screen { position: fixed; inset: 0; background: radial-gradient(circle, #2c3e50, #000); z-index: 100; display: flex; justify-content: center; align-items: center; }
        .menu-card { background: var(--surface); padding: 30px; border-radius: 25px; width: 85%; max-width: 380px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h2 { color: var(--primary); margin-bottom: 20px; letter-spacing: 1px; }
        button { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; background: var(--primary); color: white; font-size: 1rem; transition: 0.2s; }
        button:active { transform: scale(0.96); }
        .btn-sec { background: #333; }
        .btn-orange { background: var(--accent); color: black; }
        
        select { width: 100%; padding: 12px; border-radius: 10px; background: #252525; color: white; border: 1px solid #444; margin-bottom: 15px; outline: none; font-size: 1rem; }

        /* Игровой интерфейс */
        #status-bar { width: 100%; background: var(--surface); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; box-sizing: border-box; }
        #board { 
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
            width: 94vw; max-width: 500px; aspect-ratio: 1 / 1; 
            border: 5px solid #333; background: #333; margin-top: 20px;
        }
        
        .cell { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .white-c { background: var(--cell-light); }
        .black-c { background: var(--cell-dark); }
        .selected { background: #f7e03c !important; }
        
        .piece { width: 82%; height: 82%; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.6); position: relative; }
        .p-white { background: radial-gradient(circle at 30% 30%, #ffffff, #b0b0b0); border: 1px solid #999; }
        .p-black { background: radial-gradient(circle at 30% 30%, #444, #000); border: 1px solid #111; }
        .king::after { content: '👑'; font-size: 1.3rem; display: flex; justify-content: center; align-items: center; height: 100%; }
        
        .hidden { display: none !important; }
        #notif { position: fixed; top: 70px; background: var(--accent); color: black; padding: 12px 25px; border-radius: 30px; font-weight: bold; z-index: 200; display: none; }
    </style>
</head>
<body>

    <div id="notif">Игрок подключился!</div>

    <div id="start-screen">
        <div class="menu-card">
            <h2>ШАШКИ 2026</h2>
            
            <div id="main-m">
                <button onclick="showS('bot-m')">Играть с ботом</button>
                <button onclick="showS('online-m')" class="btn-orange">Игра по сети</button>
                <button onclick="startLocal()" class="btn-sec">Вдвоем (Offline)</button>
            </div>

            <div id="bot-m" class="hidden">
                <p style="text-align:left; margin-bottom:5px; font-size:0.9rem;">Сложность:</p>
                <select id="bot-lvl">
                    <option value="1">Новичок (Случайно)</option>
                    <option value="2">Мастер (Бьет всегда)</option>
                </select>
                <p style="text-align:left; margin-bottom:5px; font-size:0.9rem;">Ваш цвет:</p>
                <select id="bot-side">
                    <option value="white">Белые (Ходят первыми)</option>
                    <option value="black">Черные</option>
                </select>
                <button onclick="startBot()">Начать игру</button>
                <button class="btn-sec" onclick="showS('main-m')">Назад</button>
            </div>

            <div id="online-m" class="hidden">
                <button onclick="createRoom()">+ Создать комнату</button>
                <div id="room-list" style="margin: 10px 0; max-height: 150px; overflow-y: auto;"></div>
                <button class="btn-sec" onclick="showS('main-m')">Назад</button>
            </div>
        </div>
    </div>

    <div id="status-bar">
        <button onclick="location.reload()" style="background:#b71c1c; color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;">ВЫХОД</button>
        <div id="turn-text" style="font-weight:bold;">Ход...</div>
        <div id="info-text" style="color:var(--accent); font-size:0.8rem;"></div>
    </div>
    
    <div id="board"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCFJQ4OKKStxVW7gUj1lS4KHwxGc1_QIwg",
        authDomain: "mymobilegame-b5e68.firebaseapp.com",
        databaseURL: "https://mymobilegame-b5e68-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "mymobilegame-b5e68",
        storageBucket: "mymobilegame-b5e68.appspot.com",
        messagingSenderId: "596144565705",
        appId: "1:596144565705:web:8e359005086e1189916e7e"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let board = [], turn = 'white', selected = null;
    let mode = 'local', userColor = 'white', roomId = null;

    function showS(id) {
        document.getElementById('main-m').classList.add('hidden');
        document.getElementById('bot-m').classList.add('hidden');
        document.getElementById('online-m').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
        if(id === 'online-m') refreshLobby();
    }

    function refreshLobby() {
        const list = document.getElementById('room-list');
        db.ref('lobby').on('value', snap => {
            list.innerHTML = '';
            const data = snap.val();
            if(!data) { list.innerHTML = "<p style='opacity:0.5'>Нет комнат</p>"; return; }
            for(let id in data) {
                const b = document.createElement('button');
                b.className = "btn-sec";
                b.innerText = "Комната #" + id;
                b.onclick = () => joinRoom(id);
                list.appendChild(b);
            }
        });
    }

    function initBoard() {
        let b = Array(8).fill().map(() => Array(8).fill(null));
        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                if((r+c)%2!==0) {
                    if(r<3) b[r][c] = {color:'black', king:false};
                    else if(r>4) b[r][c] = {color:'white', king:false};
                }
            }
        }
        return b;
    }

    function render() {
        const bEl = document.getElementById('board');
        bEl.innerHTML = '';
        if(!board.length) return;

        for(let r=0; r<8; r++) {
            for(let c=0; c<8; c++) {
                const cell = document.createElement('div');
                cell.className = `cell ${(r+c)%2===0?'white-c':'black-c'}`;
                if(selected?.r===r && selected?.c===c) cell.classList.add('selected');
                
                if(board[r][c]) {
                    const p = document.createElement('div');
                    p.className = `piece p-${board[r][c].color} ${board[r][c].king?'king':''}`;
                    cell.appendChild(p);
                }
                cell.onclick = () => handleClick(r, c);
                bEl.appendChild(cell);
            }
        }
        document.getElementById('turn-text').innerText = turn==='white'?'Ход Белых':'Ход Черных';
        if(mode === 'bot' && turn !== userColor) setTimeout(doBot, 800);
    }

    function handleClick(r, c) {
        if((mode==='online' || mode==='bot') && turn !== userColor) return;
        const p = board[r][c];
        if(p && p.color === turn) {
            selected = {r, c}; render();
        } else if(selected) {
            executeMove(selected.r, selected.c, r, c);
        }
    }

    function executeMove(fR, fC, tR, tC) {
        if((tR + tC) % 2 === 0 || board[tR][tC]) return;
        const dr = tR - fR, dc = tC - fC;
        const p = board[fR][fC];

        if(Math.abs(dr) === 2) {
            const jr = fR + dr/2, jc = fC + dc/2;
            if(board[jr][jc] && board[jr][jc].color !== p.color) {
                board[jr][jc] = null;
            } else return;
        } else if(Math.abs(dr) !== 1) return;

        board[tR][tC] = p;
        board[fR][fC] = null;
        if((p.color==='white' && tR===0) || (p.color==='black' && tR===7)) p.king = true;

        turn = turn === 'white' ? 'black' : 'white';
        selected = null;
        if(mode === 'online') db.ref('rooms/' + roomId).update({ board, turn });
        render();
    }

    function doBot() {
        let moves = [];
        for(let r=0; r<8; r++)
            for(let c=0; c<8; c++)
                if(board[r][c]?.color === turn) {
                    const dirs = [[1,1],[1,-1],[-1,1],[-1,-1]];
                    dirs.forEach(([dr, dc]) => {
                        const tr=r+dr, tc=c+dc, jr=r+dr*2, jc=c+dc*2;
                        if(jr>=0 && jr<8 && jc>=0 && jc<8 && board[tr][tc] && board[tr][tc].color!==turn && !board[jr][jc])
                            moves.push({fR:r, fC:c, tR:jr, tC:jc, jump:true});
                        if(tr>=0 && tr<8 && tc>=0 && tc<8 && !board[tr][tc])
                            if(board[r][c].king || (turn==='black' ? dr===1 : dr===-1)) moves.push({fR:r, fC:c, tR:tr, tC:tc, jump:false});
                    });
                }
        const jumps = moves.filter(m => m.jump);
        const finalMove = jumps.length ? jumps[0] : moves[Math.floor(Math.random()*moves.length)];
        if(finalMove) executeMove(finalMove.fR, finalMove.fC, finalMove.tR, finalMove.tC);
    }

    function createRoom() {
        roomId = Math.floor(1000 + Math.random() * 8999).toString();
        userColor = 'white'; mode = 'online';
        board = initBoard();
        db.ref('rooms/' + roomId).set({ board, turn: 'white', players: 1 }).then(() => {
            db.ref('lobby/' + roomId).set(true);
            enterGame();
            startSync();
        });
        db.ref('rooms/' + roomId + '/players').on('value', s => { if(s.val()===2) { document.getElementById('notif').style.display='block'; }});
    }

    function joinRoom(id) {
        roomId = id; userColor = 'black'; mode = 'online';
        db.ref('rooms/' + roomId + '/players').set(2);
        db.ref('lobby/' + roomId).remove();
        enterGame();
        startSync();
    }

    function startSync() {
        db.ref('rooms/' + roomId).on('value', snap => {
            const d = snap.val();
            if(d) { board = d.board; turn = d.turn; render(); }
        });
    }

    function startBot() {
        mode = 'bot';
        userColor = document.getElementById('bot-side').value;
        board = initBoard();
        enterGame();
    }

    function startLocal() { mode = 'local'; board = initBoard(); enterGame(); }
    function enterGame() { 
        document.getElementById('start-screen').style.display = 'none'; 
        document.getElementById('info-text').innerText = mode==='online' ? "ID: "+roomId : "VS BOT";
        render(); 
    }
</script>
</body>
</html>
