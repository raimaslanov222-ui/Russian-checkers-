<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шашки Online Fix</title>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #1a1a1a; --board-700: #45a049; --board-100: #f0f0f0; --gold: #ffd700; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* Экраны */
        #screen-menu, #screen-game { width: 100%; display: flex; flex-direction: column; align-items: center; }
        #screen-game { display: none; }

        /* Меню */
        .card { background: #2a2a2a; padding: 25px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); text-align: center; width: 280px; }
        .btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: var(--gold); color: #000; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-gray { background: #444; color: #fff; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #555; background: #1a1a1a; color: #fff; text-align: center; }

        /* Доска */
        #board { 
            display: grid; grid-template-columns: repeat(8, 1fr); 
            width: 340px; height: 340px; border: 5px solid #333; 
        }
        .cell { display: flex; justify-content: center; align-items: center; }
        .dark { background: #386641; }
        .light { background: #f2e8cf; }
        
        .piece { width: 85%; height: 85%; border-radius: 50%; position: relative; box-shadow: 0 4px 2px rgba(0,0,0,0.4); }
        .white { background: #ffffff; border: 1px solid #999; }
        .black { background: #121212; border: 1px solid #444; }
        .king::after { content: 'K'; color: var(--gold); font-weight: bold; position: absolute; left: 35%; top: 20%; }
        
        .hl { background: rgba(255, 215, 0, 0.5) !important; cursor: pointer; border: 2px inset gold; }
        #status-bar { margin: 15px; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="screen-menu">
        <div class="card">
            <h1 style="color:var(--gold)">SHASHKI AI/NET</h1>
            <button class="btn" onclick="startLocal('bot')">ИГРАТЬ С БОТОМ</button>
            <hr style="border:0.5px solid #444; margin:15px 0;">
            <div id="my-id-box">Загрузка ID...</div>
            <input type="text" id="join-id" placeholder="ID соперника">
            <button class="btn btn-gray" onclick="connectToFriend()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <div id="screen-game">
        <div id="status-bar">ОЖИДАНИЕ...</div>
        <div id="board"></div>
        <button class="btn btn-gray" style="width:120px; margin-top:20px;" onclick="location.reload()">В МЕНЮ</button>
    </div>

    <script>
        let board = [], selected = null, turn = 'white';
        let mode = 'bot', myColor = 'white', peer, conn;

        // 1. Сетевая логика
        peer = new Peer();
        peer.on('open', id => document.getElementById('my-id-box').innerHTML = `Твой ID: <b style="color:var(--gold)">${id}</b>`);
        
        peer.on('connection', c => {
            conn = c;
            mode = 'net';
            myColor = 'white'; // Хост всегда белые
            initNetHandlers();
            switchScreen();
        });

        function connectToFriend() {
            const targetId = document.getElementById('join-id').value;
            if(!targetId) return alert("Введи ID!");
            conn = peer.connect(targetId);
            mode = 'net';
            myColor = 'black'; // Клиент всегда черные
            initNetHandlers();
            switchScreen();
        }

        function initNetHandlers() {
            conn.on('open', () => {
                console.log("Connected!");
                initBoard();
            });
            conn.on('data', data => {
                executeMove(data.f, data.t, data.c);
                render();
            });
        }

        // 2. Логика игры
        function startLocal(m) {
            mode = m;
            switchScreen();
            initBoard();
        }

        function switchScreen() {
            document.getElementById('screen-menu').style.display = 'none';
            document.getElementById('screen-game').style.display = 'flex';
        }

        function initBoard() {
            board = Array(8).fill().map(() => Array(8).fill(null));
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 !== 0) {
                        if (r < 3) board[r][c] = { color: 'black', king: false };
                        if (r > 4) board[r][c] = { color: 'white', king: false };
                    }
                }
            }
            render();
        }

        function render() {
            const bEl = document.getElementById('board');
            bEl.innerHTML = '';
            document.getElementById('status-bar').innerText = `ХОД: ${turn === 'white' ? 'БЕЛЫХ' : 'ЧЕРНЫХ'} ${mode==='net' ? (turn===myColor ? '(ТВОЙ)' : '(ЖДИ)') : ''}`;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r+c)%2===0 ? 'light' : 'dark'}`;
                    const p = board[r][c];
                    
                    if (p) {
                        const div = document.createElement('div');
                        div.className = `piece ${p.color} ${p.king ? 'king' : ''}`;
                        if (p.color === turn) {
                            if (mode === 'bot' || turn === myColor) div.onclick = () => { selected = {r,c}; render(); };
                        }
                        cell.appendChild(div);
                    }
                    
                    if (selected && checkMove(selected.r, selected.c, r, c)) {
                        cell.classList.add('hl');
                        cell.onclick = () => {
                            let cap = Math.abs(r - selected.r) === 2 ? { r: (r+selected.r)/2, c: (c+selected.c)/2 } : null;
                            if (mode === 'net') conn.send({ f: [selected.r, selected.c], t: [r, c], c: cap });
                            executeMove([selected.r, selected.c], [r, c], cap);
                            render();
                        };
                    }
                    bEl.appendChild(cell);
                }
            }
            if (mode === 'bot' && turn === 'black') setTimeout(botBrain, 600);
        }

        function checkMove(fr, fc, tr, tc) {
            if (board[tr][tc]) return false;
            const p = board[fr][fc];
            const dr = tr - fr, dc = tc - fc;
            if (Math.abs(dr) !== Math.abs(dc)) return false;
            
            if (Math.abs(dr) === 1) {
                if (p.king) return true;
                return p.color === 'white' ? dr === -1 : dr === 1;
            }
            if (Math.abs(dr) === 2) {
                const mid = board[fr + dr/2][fc + dc/2];
                return mid && mid.color !== p.color;
            }
            return false;
        }

        function executeMove(f, t, c) {
            const [fr, fc] = f, [tr, tc] = t;
            const p = board[fr][fc];
            board[tr][tc] = p;
            board[fr][fc] = null;
            if (c) board[c.r][c.c] = null;
            if ((p.color === 'white' && tr === 0) || (p.color === 'black' && tr === 7)) p.king = true;
            turn = turn === 'white' ? 'black' : 'white';
            selected = null;
        }

        function botBrain() {
            let moves = [];
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
                if(board[r][c]?.color === 'black') {
                    for(let dr of [-2,-1,1,2]) for(let dc of [-2,-1,1,2]) {
                        if(r+dr>=0 && r+dr<8 && c+dc>=0 && c+dc<8 && checkMove(r,c,r+dr,c+dc))
                            moves.push({ f:[r,c], t:[r+dr,c+dc], cap: Math.abs(dr)===2 });
                    }
                }
            }
            const jump = moves.find(m => m.cap);
            const m = jump || moves[Math.floor(Math.random()*moves.length)];
            if(m) executeMove(m.f, m.t, m.cap ? {r: m.f[0]+(m.t[0]-m.f[0])/2, c:m.f[1]+(m.t[1]-m.f[1])/2} : null);
            render();
        }
    </script>
</body>
</html>
